[php]
upload_max_filesize = 512M
post_max_size = 512M
clear_env = no
variables_order = "EGPCS"
expose_php = Off
short_open_tag = Off
max_input_vars = 5000
; CLI (wp-cli, WP-Cron jobs): PHP's default 128M is too little for WooCommerce. The web server sets its own memory limit.
memory_limit = 512M

[Session]
session.cookie_httponly = On
session.cookie_secure = On
session.upload_progress.enabled = Off